<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Manager</title>
    <link rel="stylesheet" href="./style/base.css">
    <link rel="stylesheet" href="./style/style-home.css">
</head>

<body>
    <div id="overlay" style="background-image: url('backgrounds/Or.png');">
        <div class="container">
            <div class="score-box" id="box-left">0</div>
            <div class="score-box" id="box-right">0</div>
        </div>
    </div>

    <div class="buttons">
        <button onclick="increment(1,'left')">+1 à gauche</button>
        <button onclick="increment(1,'right')">+1 à droite</button>
        <button onclick="reset()">Reset</button>
        <button onclick="invert()">Inverse score</button>
        <button onclick="increment(-1,'left')">-1 à gauche</button>
        <button onclick="increment(-1,'right')">-1 à droite</button>

        <div class="background-selector">
            <button onclick="moveSelection(-1)">⬆️</button>
            <button onclick="moveSelection(1)">⬇️</button>

            <select id="backgrounds">
                <option value="backgrounds/Or.png" data-forecolor="rgba(20, 20, 20, 0.90)">Or 1</option>
                <option value="backgrounds/Vege_Classique.png" data-forecolor="rgba(136, 136, 136, 1)">Classique 1</option>
                <option value="backgrounds/Vege_Clean.png" data-forecolor="rgba(136, 136, 136, 1)">Clean 1</option>
                <option value="backgrounds/Wololo_Multi.png" data-forecolor="rgba(136, 136, 136, 1)">Multiplayer</option>
                <option value="backgrounds/Vide.png" data-forecolor="rgba(255, 255, 255, 1)">Vide</option>
                <option value="backgrounds/Wololo_without_score.png" data-forecolor="rgba(255, 255, 255, 0)">Sans score</option>
                <option value="backgrounds/Wololo_Multi_without_score.png" data-forecolor="rgba(255, 255, 255, 0)">Sans score Multi</option>
                <option value="backgrounds/RoseM8.png" data-forecolor="rgba(20, 20, 20, 0.90)">Rose M8</option>
            </select>

            <button onclick="changeBackground()">Confirmer</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
